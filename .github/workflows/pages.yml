name: Deploy site to GitHub Pages

# Deploy the static site in site/ whenever it changes on main, or on demand.
on:
  push:
    branches:
      - main
    paths:
      - 'site/**'
  workflow_dispatch:

# Give the deploy job access to the Pages API and the OIDC token it needs.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a new commit should not cancel an in-flight deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Pages artifact
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
