name: Release

# Build release artifacts for every supported desktop/mobile target and attach
# them to the GitHub Release created for the pushed tag.
#
# We ship the plain `flutter build` outputs (APK/AAB, Linux bundle tarball,
# Windows folder zip, macOS .app zip). No installer tooling — keep it simple.
on:
  push:
    tags:
      - 'v*'

# ---------------------------------------------------------------------------
# iOS is intentionally NOT built here (out of scope for this initial release).
# It requires an Apple Developer account + signing certs/provisioning profiles,
# and Xcode/TestFlight — none of which are configured yet. Add a job here when
# those exist.
# ---------------------------------------------------------------------------

permissions:
  # Needed by softprops/action-gh-release to create the release and upload assets.
  contents: write

# Do not cancel sibling OS jobs: a failure on one platform should not stop the
# other platforms from shipping their artifacts.
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Android (APK/AAB) + Linux desktop
            os: ubuntu-latest
          - name: Windows desktop
            os: windows-latest
          - name: macOS desktop
            os: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # CI installs its own Flutter (stable); the vendored .flutter/ SDK is for
      # local development only.
      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Dart dependencies
        run: flutter pub get

      # ---------------------------------------------------------------------
      # Ubuntu: Android APK/AAB + Linux desktop bundle
      # ---------------------------------------------------------------------
      - name: Set up JDK 17 (Android build)
        if: runner.os == 'Linux'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install Linux desktop build dependencies
        if: runner.os == 'Linux'
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev clang cmake pkg-config liblzma-dev

      # android/app/build.gradle.kts pins ndkVersion "30.0.14904198" and
      # buildToolsVersion "37.0.0" (see the file for why). A stock GitHub
      # runner ships neither, so install exactly those components and accept
      # all SDK licenses before the Android build, or Gradle fails.
      - name: Install pinned Android NDK + build-tools and accept licenses
        if: runner.os == 'Linux'
        run: |
          set -euxo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -n 1 || true)"
          fi
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found under ANDROID_HOME ($ANDROID_HOME)"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "ndk;30.0.14904198" "build-tools;37.0.0"

      # Android release signing: android/app/build.gradle.kts signs the release
      # build with the committed android/debug.keystore (the well-known public
      # "androiddebugkey" credential). Fine for an initial open release — CI
      # needs no secrets. A real release keystore can be added later via GitHub
      # secrets without touching this workflow.
      - name: Build Android APKs (release, per-ABI)
        if: runner.os == 'Linux'
        run: flutter build apk --release --split-per-abi

      - name: Build Android App Bundle (release)
        if: runner.os == 'Linux'
        run: flutter build appbundle --release

      - name: Build Linux desktop bundle (release)
        if: runner.os == 'Linux'
        run: flutter build linux --release

      - name: Stage release files (Linux + Android)
        if: runner.os == 'Linux'
        run: |
          set -euxo pipefail
          STAGE="release-files"
          mkdir -p "$STAGE"
          # Brand the Android artifacts: app-arm64-v8a-release.apk -> hnd-viewer-arm64-v8a-release.apk
          for apk in build/app/outputs/flutter-apk/*.apk; do
            name="$(basename "$apk")"
            cp -f "$apk" "$STAGE/hnd-viewer-${name#app-}"
          done
          cp -f build/app/outputs/bundle/release/app-release.aab "$STAGE/hnd-viewer-release.aab" 2>/dev/null || true
          # Linux: ship the whole Flutter bundle as a tarball.
          tar -C build/linux/x64/release \
            --transform 's|^bundle|hnd-viewer-linux-x64|' \
            -czf "$STAGE/hnd-viewer-${GITHUB_REF_NAME}-linux-x64.tar.gz" bundle
          ls -la "$STAGE"

      # ---------------------------------------------------------------------
      # Windows: desktop folder zip
      # ---------------------------------------------------------------------
      - name: Build Windows desktop app (release)
        if: runner.os == 'Windows'
        shell: pwsh
        run: flutter build windows --release

      - name: Stage release files (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $STAGE = 'release-files'
          New-Item -ItemType Directory -Force -Path $STAGE | Out-Null
          $zip = Join-Path $STAGE "hnd-viewer-$env:GITHUB_REF_NAME-windows-x64.zip"
          Compress-Archive -Path 'build\windows\x64\runner\Release\*' -DestinationPath $zip -Force
          Get-ChildItem $STAGE | Select-Object Name, Length

      # ---------------------------------------------------------------------
      # macOS: .app zip (unsigned; Apple notarization is out of scope)
      # ---------------------------------------------------------------------
      - name: Build macOS app (release)
        if: runner.os == 'macOS'
        run: flutter build macos --release

      - name: Stage release files (macOS)
        if: runner.os == 'macOS'
        run: |
          set -euxo pipefail
          STAGE="release-files"
          mkdir -p "$STAGE"
          ditto -c -k --keepParent \
            "build/macos/Build/Products/Release/hnd_viewer.app" \
            "$STAGE/hnd-viewer-${GITHUB_REF_NAME}-macos.app.zip"
          ls -la "$STAGE"

      # ---------------------------------------------------------------------
      # Attach this OS's staged files to the tag's GitHub Release.
      # ---------------------------------------------------------------------
      - name: Attach artifacts to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-files/*
