# flutter_distributor AppImage maker settings.
# Location is fixed by flutter_distributor: linux/packaging/appimage/make_config.yaml
# (see https://fastforge.dev/makers/appimage).
#
# NOTE: flutter_distributor reads the app/executable names from the Flutter
# project itself (pubspec `name: hnd_viewer`, linux/CMakeLists.txt BINARY_NAME),
# so only *display* metadata is set here.
#
# TODO(icon): this reuses the default template icon shipped with the macOS
# scaffold. Replace with a real hnd-viewer icon once one exists (e.g.
# assets/icons/app_icon.png) and point `icon:` at it.
display_name: hnd-viewer
generic_name: HND Ear Camera Viewer

icon: macos/Runner/Assets.xcassets/AppIcon.appiconset/app_icon_1024.png

keywords:
  - camera
  - viewer
  - otoscope
  - ear

categories:
  - AudioVideo

startup_notify: true

# Extra shared libraries to bundle beyond auto-detection. Keep empty: ldd
# auto-detection covers the Flutter runtime dependencies.
include: []
