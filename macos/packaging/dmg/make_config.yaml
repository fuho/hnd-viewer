# flutter_distributor macOS DMG maker settings.
# Location is fixed by flutter_distributor: macos/packaging/dmg/make_config.yaml
# (see https://fastforge.dev/makers/dmg).
#
# `contents[].path` values are resolved relative to the dmg maker's packaging
# directory, where the built app is copied as hnd_viewer.app (macOS
# PRODUCT_NAME = hnd_viewer from macos/Runner/Configs/AppInfo.xcconfig).
#
# The resulting .dmg is NOT signed/notarized (Apple Developer ID + notarytool
# credentials are out of scope for the initial open release). See the TODO in
# .github/workflows/release.yml.
title: hnd-viewer

contents:
  - x: 448
    y: 344
    type: link
    path: /Applications
  - x: 192
    y: 344
    type: file
    path: hnd_viewer.app
