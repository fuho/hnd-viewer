name: hnd_viewer
description: "Free, open, offline viewer for the HND-NE3 ear camera: live video + gyro over raw UDP on Android, iOS, macOS, Windows and Linux."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  gal: ^2.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
